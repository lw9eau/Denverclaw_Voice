substitutions:
  name: "atom-echo-denver"
  friendly_name: "Atom Echo Denver"
  # Configuración del servidor de voz
  voice_server_host: !secret voice_server_host
  voice_server_port: "8001"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  platformio_options:
    board_build.flash_mode: dio
    build_flags:
      - '-DSERVER_HOST=\"${voice_server_host}\"'
      - '-DSERVER_PORT=${voice_server_port}'
  includes:
    - denver_voice.h
  on_boot:
    priority: 600
    then:
      - light.turn_on:
          id: led
          red: 100%
          green: 50%
          blue: 0%
          brightness: 50%
      - wait_until:
          condition:
            wifi.connected:
      - light.turn_on:
          id: led
          red: 0%
          green: 10%
          blue: 0%
          brightness: 30%
      - logger.log: "Denver Atom Echo listo"

esp32:
  board: m5stack-atom
  framework:
    type: arduino

logger:
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  on_connect:
    - light.turn_on:
        id: led
        red: 0%
        green: 10%
        blue: 0%
        brightness: 30%
  on_disconnect:
    - light.turn_on:
        id: led
        red: 100%
        green: 50%
        blue: 0%
        brightness: 50%

ota:
  - platform: esphome
    password: !secret ota_password

api:
  encryption:
    key: !secret api_encryption_key

light:
  - platform: fastled_clockless
    id: led
    chipset: SK6812
    pin: GPIO27
    num_leds: 1
    rgb_order: GRB
    name: "LED"
    restore_mode: ALWAYS_OFF

binary_sensor:
  - platform: gpio
    id: btn
    pin:
      number: GPIO39
      inverted: true
      mode:
        input: true
    name: "Botón"
    # Press: iniciar grabación (o detener si ya graba — toggle)
    on_press:
      then:
        - lambda: 'denver_btn_press();'
    # Release: detener grabación si estaba grabando (modo hold-to-talk)
    on_release:
      then:
        - lambda: 'denver_btn_release();'
